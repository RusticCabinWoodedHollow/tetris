<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1430"/>
      <stop offset="1" stop-color="#040a16"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g filter="url(#g)">
    <!-- T-tetromino -->
    <rect x="128" y="160" width="96" height="96" rx="18" fill="#00f0ff"/>
    <rect x="224" y="160" width="96" height="96" rx="18" fill="#00f0ff"/>
    <rect x="320" y="160" width="96" height="96" rx="18" fill="#00f0ff"/>
    <rect x="224" y="256" width="96" height="96" rx="18" fill="#4dff9e"/>
    <!-- falling dots -->
    <circle cx="160" cy="408" r="14" fill="#e64dff" opacity=".85"/>
    <circle cx="256" cy="408" r="14" fill="#ffe14d" opacity=".85"/>
    <circle cx="352" cy="408" r="14" fill="#ff4d6a" opacity=".85"/>
  </g>
</svg>
